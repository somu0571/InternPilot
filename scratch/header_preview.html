<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InternPilot Header UI Verification</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="../public/css/header.css">
</head>
<body class="bg-slate-100 p-4 space-y-8 font-sans">

  <div>
    <h1 class="text-xl font-bold text-slate-800 mb-2">1. Desktop Viewport (Default Full Width)</h1>
    <div class="border border-slate-300 rounded-lg overflow-hidden bg-white shadow-sm">
      <!-- Top Tricolor Border Line -->
      <div class="h-1.5 w-full bg-gradient-to-r from-orange-500 via-white to-emerald-600"></div>

      <!-- Official Government Header Bar -->
      <header class="sticky top-0 z-40 border-b border-slate-200 bg-white shadow-sm">
          <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
              <div class="flex h-20 items-center justify-between">
                  <!-- Left: Official Emblem & Platform Branding -->
                  <div class="flex min-w-0 items-center gap-3 sm:gap-4">
                      <div class="flex shrink-0 items-center">
                          <img src="../public/images/emblem.jpg" alt="State Emblem of India" class="h-10 sm:h-12 w-auto object-contain mix-blend-multiply">
                      </div>
                      <div class="hidden h-10 w-px bg-slate-200 sm:block"></div>
                      <div class="min-w-0">
                          <div class="flex items-center gap-2 sm:gap-2.5">
                              <a href="/" class="header-brand-link flex items-center gap-2 sm:gap-2.5 text-lg sm:text-xl font-black tracking-tight text-slate-900 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-600 focus-visible:ring-offset-2 rounded-lg group">
                                  <img src="../public/images/internpilot-logo.svg" alt="InternPilot Logo" class="header-brand-logo h-8 w-8 sm:h-9 sm:w-9 md:h-10 md:w-10 shrink-0 rounded-full object-contain shadow-xs">
                                  <span class="flex items-center tracking-tight"><span class="text-indigo-700">Intern</span>Pilot</span>
                              </a>
                              <span class="shrink-0 rounded-full border border-indigo-200 bg-indigo-100 px-1.5 py-0.5 sm:px-2 text-[9px] sm:text-[10px] font-bold uppercase tracking-wider text-indigo-700">PMIS</span>
                          </div>
                          <p class="hidden text-[11px] font-medium text-slate-500 sm:block">Prime Minister's Internship Scheme Portal</p>
                      </div>
                  </div>

                  <!-- Navigation, notification, and account controls -->
                  <div class="flex shrink-0 items-center gap-2 sm:gap-4 md:gap-6">
                      <nav aria-label="Primary navigation" class="hidden items-center gap-5 md:flex">
                          <a href="/" class="border-indigo-700 bg-indigo-50 text-indigo-900 font-bold nav-link inline-flex items-center border-b-2 px-1 py-2 text-xs transition-colors">Home</a>
                          <a href="/internships" class="border-transparent text-slate-600 font-semibold hover:border-indigo-300 hover:text-indigo-700 nav-link inline-flex items-center border-b-2 px-1 py-2 text-xs transition-colors">Opportunities</a>
                      </nav>

                      <div class="flex items-center gap-2 sm:gap-3">
                          <a href="/auth/login" class="rounded-lg px-2 py-2 text-xs font-semibold text-slate-700 transition-colors hover:text-indigo-700 sm:px-3">Log In</a>
                          <a href="/auth/register" class="rounded-lg bg-indigo-600 px-3 py-2 text-xs font-semibold text-white shadow-sm transition-all hover:bg-indigo-700 sm:px-4">Sign Up</a>
                      </div>

                      <div class="hidden items-center justify-center pl-2 lg:flex">
                          <img src="../public/images/azadi-logo.jpg" alt="Azadi Ka Amrit Mahotsav" class="h-11 w-auto object-contain mix-blend-multiply contrast-125">
                      </div>
                  </div>
              </div>
          </div>
      </header>
    </div>
  </div>

  <!-- Tablet Viewport (768px) -->
  <div>
    <h1 class="text-xl font-bold text-slate-800 mb-2">2. Tablet Viewport (768px)</h1>
    <div style="width: 768px;" class="border border-slate-300 rounded-lg overflow-hidden bg-white shadow-sm">
      <div class="h-1.5 w-full bg-gradient-to-r from-orange-500 via-white to-emerald-600"></div>
      <header class="border-b border-slate-200 bg-white">
          <div class="px-4">
              <div class="flex h-20 items-center justify-between">
                  <div class="flex min-w-0 items-center gap-3 sm:gap-4">
                      <div class="flex shrink-0 items-center">
                          <img src="../public/images/emblem.jpg" alt="State Emblem of India" class="h-10 sm:h-12 w-auto object-contain mix-blend-multiply">
                      </div>
                      <div class="hidden h-10 w-px bg-slate-200 sm:block"></div>
                      <div class="min-w-0">
                          <div class="flex items-center gap-2 sm:gap-2.5">
                              <a href="/" class="header-brand-link flex items-center gap-2 sm:gap-2.5 text-lg sm:text-xl font-black tracking-tight text-slate-900 rounded-lg group">
                                  <img src="../public/images/internpilot-logo.svg" alt="InternPilot Logo" class="header-brand-logo h-8 w-8 sm:h-9 sm:w-9 md:h-10 md:w-10 shrink-0 rounded-full object-contain shadow-xs">
                                  <span class="flex items-center tracking-tight"><span class="text-indigo-700">Intern</span>Pilot</span>
                              </a>
                              <span class="shrink-0 rounded-full border border-indigo-200 bg-indigo-100 px-1.5 py-0.5 sm:px-2 text-[9px] sm:text-[10px] font-bold uppercase tracking-wider text-indigo-700">PMIS</span>
                          </div>
                          <p class="hidden text-[11px] font-medium text-slate-500 sm:block">Prime Minister's Internship Scheme Portal</p>
                      </div>
                  </div>
                  <div class="flex shrink-0 items-center gap-3">
                      <a href="/auth/login" class="rounded-lg px-2.5 py-1.5 text-xs font-semibold text-slate-700">Log In</a>
                      <a href="/auth/register" class="rounded-lg bg-indigo-600 px-3 py-1.5 text-xs font-semibold text-white">Sign Up</a>
                  </div>
              </div>
          </div>
      </header>
    </div>
  </div>

  <!-- Mobile Viewport (375px) -->
  <div>
    <h1 class="text-xl font-bold text-slate-800 mb-2">3. Mobile Viewport (375px iPhone)</h1>
    <div style="width: 375px;" class="border border-slate-300 rounded-lg overflow-hidden bg-white shadow-sm">
      <div class="h-1.5 w-full bg-gradient-to-r from-orange-500 via-white to-emerald-600"></div>
      <header class="border-b border-slate-200 bg-white">
          <div class="px-3">
              <div class="flex h-16 items-center justify-between">
                  <div class="flex min-w-0 items-center gap-2">
                      <div class="flex shrink-0 items-center">
                          <img src="../public/images/emblem.jpg" alt="State Emblem of India" class="h-9 w-auto object-contain mix-blend-multiply">
                      </div>
                      <div class="min-w-0">
                          <div class="flex items-center gap-1.5">
                              <a href="/" class="header-brand-link flex items-center gap-2 text-base font-black tracking-tight text-slate-900 rounded-lg group">
                                  <img src="../public/images/internpilot-logo.svg" alt="InternPilot Logo" class="header-brand-logo h-7 w-7 shrink-0 rounded-full object-contain">
                                  <span class="flex items-center tracking-tight"><span class="text-indigo-700">Intern</span>Pilot</span>
                              </a>
                              <span class="shrink-0 rounded-full border border-indigo-200 bg-indigo-100 px-1 py-0.5 text-[8px] font-bold uppercase tracking-wider text-indigo-700">PMIS</span>
                          </div>
                      </div>
                  </div>
                  <div class="flex shrink-0 items-center gap-1.5">
                      <button type="button" class="p-1.5 rounded-lg text-slate-700 hover:bg-slate-100">
                          <i class="ph-bold ph-list text-xl"></i>
                      </button>
                  </div>
              </div>
          </div>
      </header>
    </div>
  </div>

</body>
</html>
